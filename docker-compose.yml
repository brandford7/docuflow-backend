services:
  postgres-db:
    image: 'postgres:latest'
    container_name: docuflow-postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-docuflow}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: