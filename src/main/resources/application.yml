# ===================================================================
# Standard Spring Boot Configurations
# ===================================================================
spring:
  application:
    name: docuflow-api

  # Database Connection
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/docuflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Settings
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Use 'update' only during initial prototyping
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true

  # File Upload Limits
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Custom App Properties (Maps to com.docuflow.api.config.AppProperties)
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

  # Security & Auth
  jwt:
    # Default 32+ character dummy key ensures validation passes if .env is missing
    secret: ${APP_JWT_SECRET:defaultSuperSecretKeyMustBeAtLeast32CharactersLongForValidation!}
    access-token-expiry-ms: 86400000 # 24 Hours
    refresh-token-expiry-ms: 604800000 # 7 Days

  # Cloud Storage
  r2:
    endpoint: ${APP_R2_ENDPOINT:https://account_id.r2.cloudflarestorage.com}
    access-key: ${APP_R2_ACCESS_KEY:default_local_r2_access_key_placeholder}
    secret-key: ${APP_R2_SECRET_KEY:default_local_r2_secret_key_placeholder_value}
    bucket: ${APP_R2_BUCKET:docuflow-local-bucket}
    public-url: ${APP_R2_PUBLIC_URL:http://localhost:3000/pub}
    presigned-url-ttl-minutes: 60

  # External Services
  processing:
    gotenberg-url: ${APP_GOTENBERG_URL:http://localhost:3000}
    job-timeout-seconds: 120

  paystack:
    secret-key: ${APP_PAYSTACK_SECRET_KEY:sk_test_default_paystack_secret_key_placeholder}
    webhook-secret: ${APP_PAYSTACK_WEBHOOK_SECRET:default_paystack_webhook_secret_placeholder}
    base-url: https://api.paystack.co

  mail:
    from: ${APP_MAIL_FROM:noreply@docuflow.com}
    from-name: DocuFlow

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}

  # Usage Limits & Subscription Plans
  plans:
    free:
      max-file-size-mb: 5
      max-ops-per-day: 3
      storage-limit-mb: 500
      file-expiry-days: 7
    pro:
      max-file-size-mb: 50
      max-ops-per-day: -1 # Unlimited
      storage-limit-mb: 5000
      file-expiry-days: 30

# Monitoring & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
