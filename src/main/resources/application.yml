# ============================================================
# application.yml — base configuration
#
# This file contains settings that are the same across ALL
# environments (dev, prod). Profile-specific files override
# only what needs to change.
#
# Spring loads: application.yml + application-{profile}.yml
# Values in the profile file win over values here.
# ============================================================

spring:
  application:
    name: docuflow-api

  # Flyway owns the schema — Hibernate only validates it.
  # Never use create, create-drop, or update in any environment.
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 20
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 20
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

  # Mail defaults — override credentials in profile files
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
  error:
    # Never expose internal error messages to clients
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
  default-produces-media-type: application/json

# ── Custom app properties ──────────────────────────────────
app:
  jwt:
    # Secret is set per-environment. This value is just a reminder.
    # Min 32 characters. Set JWT_SECRET env var in production.
    secret: ${JWT_SECRET:local-dev-secret-key-min-32-chars-ok}
    access-token-expiry-ms: 86400000    # 24 hours
    refresh-token-expiry-ms: 604800000  # 7 days

  r2:
    endpoint: ${R2_ENDPOINT:https://placeholder.r2.cloudflarestorage.com}
    access-key: ${R2_ACCESS_KEY:placeholder}
    secret-key: ${R2_SECRET_KEY:placeholder}
    bucket: ${R2_BUCKET:docuflow-files}
    public-url: ${R2_PUBLIC_URL:https://placeholder.example.com}
    presigned-url-ttl-minutes: 60

  processing:
    gotenberg-url: ${GOTENBERG_URL:http://localhost:3001}
    job-timeout-seconds: 120

  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:placeholder}
    webhook-secret: ${PAYSTACK_WEBHOOK_SECRET:placeholder}
    base-url: https://api.paystack.co

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  mail:
    from: ${MAIL_FROM:noreply@docuflow.app}
    from-name: DocuFlow

  plans:
    free:
      max-file-size-mb: 5
      max-ops-per-day: 3
      storage-limit-mb: 500
      file-expiry-days: 7
    pro:
      max-file-size-mb: 50
      max-ops-per-day: -1
      storage-limit-mb: 10240
      file-expiry-days: 365
